<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>六面体展开图编辑器 - 3D图形编辑器</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            overflow: hidden;
        }

        #main-container {
            display: flex;
            height: 100vh;
            padding: 20px;
            gap: 20px;
        }

        /* 左侧工具栏 */
        #toolbar {
            width: 280px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            overflow-y: auto;
        }

        .section-title {
            color: #667eea;
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 15px;
            border-bottom: 2px solid #667eea;
            padding-bottom: 5px;
        }

        .control-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #333;
            font-size: 14px;
        }

        button, select, input[type="number"], input[type="color"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
            margin-bottom: 8px;
            cursor: pointer;
        }

        button {
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            border: none;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }

        button:active {
            transform: translateY(0);
        }

        button.secondary {
            background: linear-gradient(45deg, #6c757d, #5a6268);
        }

        button.success {
            background: linear-gradient(45deg, #28a745, #20c997);
        }

        button.danger {
            background: linear-gradient(45deg, #dc3545, #c82333);
        }

        .tool-buttons {
            display: flex;
            gap: 8px;
        }

        .tool-buttons button {
            flex: 1;
        }

        .tool-buttons button.active {
            background: linear-gradient(45deg, #28a745, #20c997) !important;
            transform: scale(1.05);
            box-shadow: 0 4px 8px rgba(40, 167, 69, 0.4);
        }

        /* 中间展开图区域 */
        #editor-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        #net-container {
            flex: 2;
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            overflow: hidden;
            position: relative;
        }

        /* 右侧3D预览 */
        #preview-area {
            width: 400px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        #preview-container {
            flex: 1;
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            overflow: hidden;
        }

        /* 提示信息 */
        #tooltip {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.85);
            color: white;
            padding: 12px 24px;
            border-radius: 25px;
            font-size: 14px;
            display: none;
            z-index: 9999;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        /* 快捷键提示 */
        .shortcuts {
            background: #f8f9fa;
            padding: 12px;
            border-radius: 5px;
            font-size: 12px;
            color: #666;
            margin-top: 10px;
            border: 1px solid #e9ecef;
        }

        .shortcuts kbd {
            background: #e9ecef;
            padding: 2px 6px;
            border-radius: 3px;
            font-family: 'Consolas', monospace;
            font-size: 11px;
            border: 1px solid #dee2e6;
        }

        /* 滑块样式 */
        input[type="range"] {
            width: 100%;
            margin: 8px 0;
        }

        /* 面标签颜色 */
        .face-legend {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 5px;
            font-size: 11px;
            margin-top: 10px;
        }

        .face-legend-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .face-color-box {
            width: 12px;
            height: 12px;
            border: 1px solid #999;
            border-radius: 2px;
        }

        /* 滚动条样式 */
        #toolbar::-webkit-scrollbar {
            width: 6px;
        }

        #toolbar::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 3px;
        }

        #toolbar::-webkit-scrollbar-thumb {
            background: #888;
            border-radius: 3px;
        }

        #toolbar::-webkit-scrollbar-thumb:hover {
            background: #555;
        }
    </style>
</head>
<body>
    <div id="main-container">
        <!-- 左侧工具栏 -->
        <div id="toolbar">
            <button id="back-to-main" class="secondary" style="margin-bottom: 20px;">
                ← 返回主编辑器
            </button>

            <div class="section-title">🎲 展开模式</div>
            <div class="control-group">
                <label for="template-select">选择展开方式:</label>
                <select id="template-select">
                    <option value="">加载中...</option>
                </select>
            </div>

            <div class="section-title">🖌️ 绘图工具</div>
            <div class="control-group">
                <div class="tool-buttons">
                    <button id="brush-tool" class="active">画笔</button>
                    <button id="eraser-tool">橡皮擦</button>
                </div>
            </div>

            <div class="control-group">
                <label for="color-picker">画笔颜色:</label>
                <input type="color" id="color-picker" value="#000000">
            </div>

            <div class="control-group">
                <label for="brush-size">画笔大小:</label>
                <input type="range" id="brush-size" min="1" max="50" value="5">
                <div style="text-align: center; color: #666; font-size: 12px;">
                    <span id="brush-size-value">5</span>px
                </div>
            </div>

            <div class="section-title">⚙️ 操作</div>
            <div class="control-group">
                <div class="tool-buttons">
                    <button id="undo" class="secondary">撤销</button>
                    <button id="redo" class="secondary">重做</button>
                </div>
            </div>

            <div class="control-group">
                <button id="clear-current" class="danger">清空当前面</button>
                <button id="clear-all" class="danger">清空所有面</button>
            </div>

            <div class="section-title">💾 导出/导入</div>
            <div class="control-group">
                <button id="export-config" class="success">导出配置 (JSON)</button>
                <button id="export-png" class="success">导出图片 (PNG)</button>
                <input type="file" id="import-config" accept=".json" style="display: none;">
                <button id="import-config-btn" class="secondary">导入配置</button>
            </div>

            <div class="shortcuts">
                <strong>快捷键:</strong><br>
                <kbd>B</kbd> 画笔工具<br>
                <kbd>E</kbd> 橡皮擦<br>
                <kbd>Ctrl+Z</kbd> 撤销<br>
                <kbd>Ctrl+Y</kbd> 重做
            </div>
        </div>

        <!-- 中间展开图编辑区 -->
        <div id="editor-area">
            <div id="net-container"></div>
        </div>

        <!-- 右侧3D预览区 -->
        <div id="preview-area">
            <div class="section-title">👁️ 3D预览</div>
            <div id="preview-container"></div>
        </div>
    </div>

    <!-- 提示信息 -->
    <div id="tooltip"></div>

    <!-- 加载Three.js和Konva -->
    <script type="importmap">
    {
        "imports": {
            "three": "./libs/three/three.module.js",
            "three/addons/": "./libs/three/addons/"
        }
    }
    </script>

    <script src="https://unpkg.com/konva@9.2.0/konva.min.js"></script>
    <script type="module" src="cube-net-editor.js"></script>
</body>
</html>
